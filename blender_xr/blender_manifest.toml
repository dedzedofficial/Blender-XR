schema_version = "1.0.0"
id = "blender_xr"
version = "0.8.0"
name = "Mesh XR"
tagline = "Icon-first VR modeling, materials and UV workflows"
maintainer = "Ded Zed"
type = "add-on"
website = "https://github.com/dedzedofficial/Blender-XR"
support = "https://github.com/dedzedofficial/Blender-XR/issues"
tags = ["3D View", "Mesh", "User Interface"]
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64", "linux-x64"]
wheels = [
    "./wheels/openvr-2.12.1401-py3-none-any.whl",
]

[permissions]
network = "Receive optional local SteamVR hand input"
files = "Load texture images and save Blender projects"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
