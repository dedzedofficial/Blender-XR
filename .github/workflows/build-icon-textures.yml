name: Build Blender UI icon textures

on:
  push:
    branches:
      - fix/v0.7.5-functional-ui-rigging-grab
    paths:
      - "blender_xr/icons_src/**"
      - "tools/build_icon_textures.py"

permissions:
  contents: write

jobs:
  rasterize-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Mesh XR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG rasterizer
        run: python -m pip install cairosvg
      - name: Build transparent PNG textures
        run: python tools/build_icon_textures.py
      - name: Commit generated textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blender_xr/icons/*.png
          if git diff --cached --quiet; then
            echo "Icon textures are already up to date."
          else
            git commit -m "Build transparent Blender UI icon textures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
