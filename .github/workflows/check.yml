name: Validate Mesh XR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        blender: ["4.2.0", "4.5.0", "5.0.0", "5.2.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finger protocol and profile tests
        run: |
          python tests/test_gestures.py
          python tests/test_prune.py
      - name: Check Python syntax
        run: python -m compileall -q blender_xr tests
      - name: Regenerate and validate 256px icon textures
        run: |
          python -m pip install cairosvg
          python tools/build_icon_textures.py
      - name: Build installer
        run: python scripts/build.py
      - name: Verify bundled OpenVR wheel
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('blender_xr/blender_manifest.toml','rb'))['version'])")
          unzip -l "dist/mesh-xr-v${version}.zip" | grep -F "wheels/openvr-2.12.1401-py3-none-any.whl"
      - name: Download Blender
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Installed extension package smoke test
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: |
          BLENDER="/tmp/blender-${BLENDER_VERSION}-linux-x64/blender"
          TEST_HOME="/tmp/mesh-xr-extension-home-${BLENDER_VERSION}"
          rm -rf "$TEST_HOME"
          mkdir -p "$TEST_HOME"
          PACKAGE=$(ls dist/mesh-xr-v*.zip)
          HOME="$TEST_HOME" "$BLENDER" --command extension repo-add bxr_test --name "Mesh XR Test" --directory "$TEST_HOME/extensions" --clear-all
          HOME="$TEST_HOME" "$BLENDER" --command extension install-file -r bxr_test -e "$PACKAGE"
          HOME="$TEST_HOME" "$BLENDER" --background --python-exit-code 1 --python-expr "import bpy, openvr; m='bl_ext.bxr_test.blender_xr'; assert m in bpy.context.preferences.addons, [a.module for a in bpy.context.preferences.addons]; assert hasattr(bpy.ops.blender_xr,'session'); assert hasattr(bpy.types,'BXR_PT_panel'); print('PASS installed extension package with OpenVR wheel',m,openvr.__file__)"
      - name: Mesh and registration tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_blender.py
      - name: Native Blender launch UI tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_ui.py
      - name: v0.7.5 asset audit and rigging tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v075_features.py
      - name: Locomotion, modal regression and primitive tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_controls.py
      - name: Flight, turning and ray-switch tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_flight.py
      - name: Project saving tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_save.py
      - name: XYZ handles and face deletion tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_axes.py
      - name: v0.5 vertex edge face mesh tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_mesh_v05.py
      - name: v0.5.2 color shading and statistics tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v052.py
      - name: v0.5.6 selected edit scale and VR color tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v056.py
      - name: v0.6 materials textures and UV mapping tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v060.py
      - name: v0.6.5 modeling and icon UI tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: |
          set +e
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v065.py
          result=$?
          if [[ "$result" -ne 0 ]]; then
            echo "Blender exited with status $result"
            if [[ -f /tmp/blender.crash.txt ]]; then
              echo "==== Native Blender crash stack ===="
              cat /tmp/blender.crash.txt
            fi
          fi
          exit "$result"
      - name: v0.7.1 advanced modeling and history tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v071.py
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-xr-${{ matrix.blender }}
          path: dist/*
