name: Validate Mesh XR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender: ["4.2.0", "4.5.0", "5.0.0", "5.2.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finger protocol and profile tests
        run: |
          python tests/test_gestures.py
          python tests/test_v080_controls.py
          python tests/test_platform_support.py
          python tests/test_prune.py
      - name: Check Python syntax
        run: python -m compileall -q blender_xr tests
      - name: Regenerate and validate 256px icon textures
        run: |
          python -m pip install cairosvg
          python tools/build_icon_textures.py
      - name: Build installer
        run: python scripts/build.py
      - name: Verify bundled OpenVR wheel
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('blender_xr/blender_manifest.toml','rb'))['version'])")
          unzip -l "dist/mesh-xr-v${version}.zip" | grep -F "wheels/openvr-2.12.1401-py3-none-any.whl"
      - name: Download Blender
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Installed extension package smoke test
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: |
          BLENDER="/tmp/blender-${BLENDER_VERSION}-linux-x64/blender"
          TEST_HOME="/tmp/mesh-xr-extension-home-${BLENDER_VERSION}"
          rm -rf "$TEST_HOME"
          mkdir -p "$TEST_HOME"
          PACKAGE=$(ls dist/mesh-xr-v*.zip)
          HOME="$TEST_HOME" "$BLENDER" --command extension repo-add bxr_test --name "Mesh XR Test" --directory "$TEST_HOME/extensions" --clear-all
          HOME="$TEST_HOME" "$BLENDER" --command extension install-file -r bxr_test -e "$PACKAGE"
          HOME="$TEST_HOME" "$BLENDER" --background --python-exit-code 1 --python-expr "import bpy, openvr; m='bl_ext.bxr_test.blender_xr'; assert m in bpy.context.preferences.addons, [a.module for a in bpy.context.preferences.addons]; assert hasattr(bpy.ops.blender_xr,'session'); assert hasattr(bpy.types,'BXR_PT_panel'); print('PASS installed extension package with OpenVR wheel',m,openvr.__file__)"
      - name: Mesh and registration tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_blender.py
          result=$?
          if [[ "$result" -ne 0 && -f /tmp/blender.crash.txt ]]; then
            echo "==== Blender native crash stack ===="
            cat /tmp/blender.crash.txt
          fi
          exit "$result"
      - name: Native Blender launch UI tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_ui.py
      - name: v0.7.6 compact sidebar smoke tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_ui_v076.py
      - name: v0.7.6 native weight mode and Blender parent tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_weight_mode_parent_v076.py
      - name: v0.7.6 unified controller select and transform tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_interaction_v076.py
      - name: v0.7.6 paired rigging, group and VR brush integration tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_rigging_v076.py
      - name: v0.7.6 in-headset bone selection and armature edit tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_armature_v076.py
      - name: v0.7.6 freeform armature and weight painting tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v075_features.py
      - name: Locomotion, modal regression and primitive tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_controls.py
      - name: Flight, turning and ray-switch tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_flight.py
      - name: Project saving tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_save.py
      - name: XYZ handles and face deletion tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_axes.py
      - name: v0.5 vertex edge face mesh tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_mesh_v05.py
      - name: v0.5.2 color shading and statistics tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v052.py
      - name: v0.5.6 selected edit scale and VR color tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v056.py
      - name: v0.6 materials textures and UV mapping tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v060.py
      - name: v0.6.5 modeling and icon UI tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: |
          set +e
          /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v065.py
          result=$?
          if [[ "$result" -ne 0 ]]; then
            echo "Blender exited with status $result"
            if [[ -f /tmp/blender.crash.txt ]]; then
              echo "==== Native Blender crash stack ===="
              cat /tmp/blender.crash.txt
            fi
          fi
          exit "$result"
      - name: v0.7.1 advanced modeling and history tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v071.py
      - name: v0.8 articulated XR hand geometry tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v080_hands.py
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-xr-${{ matrix.blender }}
          path: dist/*

  desktop-cross-platform-package:
    name: Desktop package / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            blender_version: ''
            blender_arch: ''
          - platform: macos-15
            blender_version: '5.2.2'
            blender_arch: arm64
          - platform: macos-15-intel
            blender_version: '4.5.15'
            blender_arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Platform compatibility, radial and skeletal regressions
        run: |
          python tests/test_platform_support.py
          python tests/test_v080_controls.py
          python tests/test_gestures.py
      - name: Compile source and tests
        run: python -m compileall -q blender_xr tests
      - name: Build platform-neutral desktop extension
        run: python scripts/build.py
      - name: Verify Windows/Linux baseline and both macOS architectures inside ZIP
        run: python tests/test_platform_package.py
      - name: Download official Blender desktop for native Mac integration tests
        if: runner.os == 'macOS'
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.blender_version }}
          BLENDER_ARCH: ${{ matrix.blender_arch }}
        run: |
          set -euo pipefail
          series="${BLENDER_VERSION%.*}"
          url="https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-macos-${BLENDER_ARCH}.dmg"
          curl --fail --location --retry 3 --silent --show-error "$url" -o "$RUNNER_TEMP/meshxr-blender.dmg"
          mkdir -p "$RUNNER_TEMP/meshxr-mounted"
          hdiutil attach "$RUNNER_TEMP/meshxr-blender.dmg" -mountpoint "$RUNNER_TEMP/meshxr-mounted" -nobrowse -quiet
          test -x "$RUNNER_TEMP/meshxr-mounted/Blender.app/Contents/MacOS/Blender"
      - name: Native Blender macOS add-on and hand/rigging regression tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BLENDER="$RUNNER_TEMP/meshxr-mounted/Blender.app/Contents/MacOS/Blender"
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python tests/test_ui.py
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python tests/test_v080_hands.py
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python tests/test_blender.py
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python tests/test_rigging_v076.py
      - name: Unmount official Blender DMG
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/meshxr-mounted/Blender.app" ]; then
            hdiutil detach "$RUNNER_TEMP/meshxr-mounted" -quiet || true
          fi

  preview-package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Blender icon textures
        run: |
          python -m pip install cairosvg
          python tools/build_icon_textures.py
      - name: Validate and package test extension
        run: |
          python -m compileall -q blender_xr
          python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-xr-v0.8.0-alpha-preview
          path: |
            dist/mesh-xr-v0.8.0.zip
            dist/mesh-xr-v0.8.0.zip.sha256
          retention-days: 30
