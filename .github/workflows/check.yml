name: Validate Blender XR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        blender: ["4.2.0", "4.5.0", "5.0.0", "5.2.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finger protocol and profile tests
        run: |
          python tests/test_gestures.py
          python tests/test_prune.py
      - name: Build installer
        run: python scripts/build.py
      - name: Download Blender
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Installed extension package smoke test
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: |
          BLENDER="/tmp/blender-${BLENDER_VERSION}-linux-x64/blender"
          TEST_HOME="/tmp/blender-xr-extension-home-${BLENDER_VERSION}"
          rm -rf "$TEST_HOME"
          mkdir -p "$TEST_HOME"
          PACKAGE=$(ls dist/blender-xr-v*.zip)
          HOME="$TEST_HOME" "$BLENDER" --command extension repo-add bxr_test --name "Blender XR Test" --directory "$TEST_HOME/extensions" --clear-all
          HOME="$TEST_HOME" "$BLENDER" --command extension install-file -r bxr_test -e "$PACKAGE"
          HOME="$TEST_HOME" "$BLENDER" --background --python-exit-code 1 --python-expr "import bpy; m='bl_ext.bxr_test.blender_xr'; assert m in bpy.context.preferences.addons, [a.module for a in bpy.context.preferences.addons]; assert hasattr(bpy.ops.blender_xr,'session'); assert hasattr(bpy.types,'BXR_PT_panel'); print('PASS installed extension package',m)"
      - name: Mesh and registration tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_blender.py
      - name: Native Blender launch UI tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_ui.py
      - name: Locomotion, modal regression and primitive tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_controls.py
      - name: Flight, turning and ray-switch tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_flight.py
      - name: Project saving tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_save.py
      - name: XYZ handles and face deletion tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_axes.py
      - name: v0.5 vertex edge face mesh tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_mesh_v05.py
      - name: v0.5.2 color shading and statistics tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v052.py
      - name: v0.5.6 selected edit scale and VR color tests
        env:
          BLENDER_VERSION: ${{ matrix.blender }}
        run: /tmp/blender-${BLENDER_VERSION}-linux-x64/blender --background --factory-startup --python-exit-code 1 --python tests/test_v056.py
      - uses: actions/upload-artifact@v4
        with:
          name: blender-xr-${{ matrix.blender }}
          path: dist/*
